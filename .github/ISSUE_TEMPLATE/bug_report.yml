name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Search for Palmeiras\n2. Click 'Ver escalações'\n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Backend log or browser console output
      description: Remove any API keys or passwords before pasting.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Go/Node versions, Ollama model, commit"
